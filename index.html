<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Cartões Dwin</title>

    <style>

        :root{
            --vinho:#9e1321;
            --vinho2:#b21d29;
            --claro:#f6f2f2;
            --texto:#251d1e;
        }

        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        body{
            min-height:100vh;
            background:var(--claro);
            font-family:Arial, Helvetica, sans-serif;
            color:var(--texto);
            padding:18px 14px 30px;
        }

        .container{
            width:100%;
            max-width:480px;
            margin:0 auto;
        }

        /* IMAGEM NO TOPO */

        .capa{
            display:block;
            width:100%;
            height:auto;
            margin:0 auto 24px;
            border-radius:18px;
            box-shadow:0 10px 30px rgba(63,0,8,.22);
        }

        /* TÍTULO */

        h1{
            text-align:center;
            color:var(--vinho);
            margin:0 0 8px;
            font-size:28px;
        }

        p{
            text-align:center;
            color:#75696b;
            margin-bottom:20px;
        }

        /* MENU DOS CONTATOS */

        .menu{
            display:grid;
            gap:12px;
        }

        .menu a{
            display:block;
            padding:16px;
            background:#fff;
            color:var(--vinho);
            text-decoration:none;
            font-weight:700;
            border-radius:12px;
            text-align:center;
            box-shadow:0 4px 12px rgba(0,0,0,.08);
            transition:transform .15s, box-shadow .15s;
        }

        .menu a:hover{
            transform:translateY(-2px);
            box-shadow:0 8px 18px rgba(0,0,0,.14);
        }

        .menu a:active{
            transform:scale(.98);
        }

    </style>

</head>

<body>

    <main class="container">

        <!-- IMAGEM ACIMA DO TÍTULO -->

        <img
            src="./capa.png"
            class="capa"
            alt="Dwin Soluções em Brindes"
        >

        <h1>Cartões Dwin</h1>

        <p>Selecione um contato</p>

        <nav class="menu">

            <a href="./raphaelly/">
                Raphaelly
            </a>

            <a href="./anna/">
                Anna Helena
            </a>

            <a href="./patricia/">
                Patricia
            </a>

            <a href="./karina/">
                Karina
            </a>

            <a href="./leticia/">
                Letícia
            </a>

            <a href="./jennifer/">
                Jennifer
            </a>

        </nav>

    </main>

</body>

</html>
