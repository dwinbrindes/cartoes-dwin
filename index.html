<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cartões Dwin</title><style>
:root{--vinho:#9e1321;--vinho2:#b21d29;--claro:#f6f2f2;--texto:#251d1e}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--claro);font-family:Arial,Helvetica,sans-serif;color:var(--texto);padding:18px 14px 30px}
.container{width:100%;max-width:480px;margin:0 auto}
.card-wrap{position:relative;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 10px 30px rgba(63,0,8,.22)}
.card-wrap img{display:block;width:100%;height:auto}
.hotspot{position:absolute;z-index:5;left:39%;width:54%;border-radius:8px}
.hotspot:focus{outline:3px solid #fff;outline-offset:2px;background:rgba(255,255,255,.12)}
.hs-phone{top:63.5%;height:6.5%}.hs-email{top:70.2%;height:6.5%}.hs-instagram{top:80.6%;height:5.5%}.hs-catalog{top:86.0%;height:5.5%}.hs-site{top:91.2%;height:5.5%}
.buttons{display:grid;gap:11px;margin-top:20px}
.btn{min-height:54px;border-radius:12px;padding:13px 18px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-weight:700;font-size:16px;box-shadow:0 4px 12px rgba(0,0,0,.08);transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.98)}.btn:hover{opacity:.92}
.whatsapp{background:#25d366;color:#fff}.primary{background:var(--vinho);color:#fff}.light{background:#fff;color:var(--vinho);border:1px solid #e3d7d9}
.footer{text-align:center;color:#75696b;font-size:12px;line-height:1.5;margin-top:20px}

.menu{display:grid;gap:12px;margin-top:20px}.menu a{display:block;padding:16px;background:#fff;color:var(--vinho);text-decoration:none;font-weight:700;border-radius:12px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.08)}h1{text-align:center;color:var(--vinho);margin:24px 0 8px}p{text-align:center;color:#75696b}</style></head><body><main class="container"><h1>Cartões Dwin</h1><p>Selecione um contato</p><nav class="menu"><a href="raphaelly/">Raphaelly</a>
<a href="anna/">Anna Helena</a>
<a href="patricia/">Patricia</a>
<a href="karina/">Karina</a>
<a href="leticia/">Letícia</a>
<a href="jennifer/">Jennifer</a></nav></main></body></html>
